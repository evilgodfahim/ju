name: Update Jugantor RSS Feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --shm-size=2g
        env:
          LOG_LEVEL: info

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "Waiting for FlareSolverr..."
          for i in $(seq 1 20); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd":"request.get","url":"https://example.com","maxTimeout":5000}' || echo "000")
            if [ "$status" = "200" ]; then
              echo "FlareSolverr is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 3s..."
            sleep 3
          done
          echo "FlareSolverr did not become ready in time"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Generate RSS feed
        run: python generate_rss.py

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: actions@github.com
          message: Update Jugantor RSS feed